<svg width="640" height="344" viewBox="0 0 640 344" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The recent sessions sheet floats over the sidebar list with a search field, a settings icon in its title bar, marked with a dot because a saved filter is on, keeping the subagent, range and live-bar switches folded away, one main session folding two subagent sessions under it, and a live bar along the bottom listing the sessions in progress">
  <!-- sidebar column -->
  <rect x="28" y="22" width="212" height="256" rx="16" fill="#F7FAFE" stroke="#D7E4F4" stroke-width="2"/>
  <rect x="48" y="42" width="120" height="10" rx="5" fill="#DCE8F6"/>
  <rect x="48" y="62" width="164" height="12" rx="6" fill="#E6EFFA"/>
  <rect x="48" y="82" width="140" height="12" rx="6" fill="#E6EFFA"/>

  <!-- the sheet: as wide as the column, floating over its list; the switches
       are folded behind the settings icon, so the list starts right under the search -->
  <rect x="28" y="90" width="212" height="160" rx="14" fill="#FFFFFF" stroke="#2F7DD1" stroke-width="2"/>
  <rect x="48" y="101" width="86" height="10" rx="5" fill="#B9D3F2"/>
  <rect x="148" y="101" width="32" height="10" rx="5" fill="#DCE8F6"/>

  <!-- the settings icon: the sliders glyph, accent-coloured with a dot because
       a saved filter is on in this state -->
  <path d="M186 102.6h14M195 101v3.2M186 106.6h14M190 105v3.2M186 110.6h14M197 109v3.2" stroke="#2F7DD1" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="201" cy="100.6" r="2.2" fill="#2F7DD1"/>

  <!-- close -->
  <path d="m213 102 8 8m0-8-8 8" stroke="#C3D6EC" stroke-width="1.6" stroke-linecap="round"/>

  <!-- search field: magnifier and placeholder, focused when the sheet opens -->
  <rect x="44" y="117" width="180" height="24" rx="7" fill="#F3F8FE" stroke="#BFD8F3" stroke-width="1.5"/>
  <circle cx="56" cy="128" r="3.4" stroke="#2F7DD1" stroke-width="1.6"/>
  <path d="m59 131 3.4 3.4" stroke="#2F7DD1" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="68" y="125" width="76" height="8" rx="4" fill="#C3D6EC"/>

  <!-- folded main session: chevron, running dot, title, meta, subagent count -->
  <rect x="42" y="147" width="184" height="32" rx="9" fill="#EAF2FD"/>
  <path d="M54 159l4 4 4-4" stroke="#2F7DD1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="76" cy="163" r="3.5" fill="#2F7DD1"/>
  <rect x="88" y="152" width="86" height="9" rx="4.5" fill="#8FB7E4"/>
  <rect x="88" y="165" width="56" height="6" rx="3" fill="#C3D6EC"/>
  <rect x="182" y="154" width="34" height="13" rx="6.5" fill="#CFE1F6"/>

  <!-- two indented subagent rows -->
  <rect x="60" y="183" width="162" height="18" rx="7" fill="#F3F8FE"/>
  <circle cx="76" cy="192" r="3" fill="#2F7DD1"/>
  <rect x="86" y="188" width="78" height="8" rx="4" fill="#B9D3F2"/>
  <rect x="172" y="189" width="34" height="6" rx="3" fill="#DCE8F6"/>

  <rect x="64" y="205" width="154" height="16" rx="7" fill="#F8FBFE"/>
  <circle cx="80" cy="213" r="3" fill="#DCE8F6"/>
  <rect x="90" y="209" width="62" height="7" rx="3.5" fill="#D3E3F5"/>
  <rect x="164" y="211" width="30" height="6" rx="3" fill="#E6EFFA"/>

  <!-- one more idle session, at the sheet's lower edge -->
  <rect x="42" y="225" width="184" height="18" rx="7" fill="#FBFDFF"/>
  <circle cx="76" cy="234" r="3" fill="#DCE8F6"/>
  <rect x="88" y="230" width="96" height="8" rx="4" fill="#E6EFFA"/>
  <rect x="194" y="231" width="26" height="6" rx="3" fill="#EEF3FA"/>

  <!-- close-up: the same parent row, larger -->
  <rect x="336" y="62" width="272" height="46" rx="12" fill="#EAF2FD" stroke="#2F7DD1" stroke-width="2"/>
  <path d="M358 80l5 5 5-5" stroke="#2F7DD1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="386" cy="85" r="5" fill="#2F7DD1"/>
  <rect x="404" y="70" width="112" height="12" rx="6" fill="#8FB7E4"/>
  <rect x="404" y="88" width="74" height="8" rx="4" fill="#C3D6EC"/>
  <rect x="546" y="74" width="44" height="20" rx="10" fill="#CFE1F6"/>

  <rect x="360" y="120" width="240" height="32" rx="10" fill="#F3F8FE"/>
  <circle cx="380" cy="136" r="4" fill="#2F7DD1"/>
  <rect x="394" y="130" width="104" height="10" rx="5" fill="#B9D3F2"/>
  <rect x="394" y="143" width="66" height="7" rx="3.5" fill="#DCE8F6"/>

  <rect x="368" y="160" width="232" height="32" rx="10" fill="#F8FBFE"/>
  <circle cx="388" cy="176" r="4" fill="#DCE8F6"/>
  <rect x="402" y="170" width="88" height="10" rx="5" fill="#D3E3F5"/>
  <rect x="402" y="183" width="52" height="7" rx="3.5" fill="#E6EFFA"/>

  <rect x="376" y="200" width="224" height="30" rx="10" fill="#FBFDFF"/>
  <circle cx="396" cy="215" r="4" fill="#F0B429"/>
  <rect x="410" y="209" width="72" height="10" rx="5" fill="#DCE8F6"/>
  <rect x="410" y="222" width="44" height="7" rx="3.5" fill="#EEF3FA"/>

  <!-- the sheet spans the column; a fourth row peeks under it -->
  <rect x="360" y="250" width="248" height="26" rx="10" fill="#FFFFFF" stroke="#CFE1F6" stroke-width="1.5"/>
  <rect x="378" y="259" width="96" height="9" rx="4.5" fill="#DCE8F6"/>
  <rect x="500" y="259" width="56" height="9" rx="4.5" fill="#E6EFFA"/>

  <!-- live bar: the shell.bottom strip under every column, listing in-progress sessions -->
  <rect x="0" y="306" width="640" height="38" fill="#FFFFFF"/>
  <rect x="0" y="306" width="640" height="1.5" fill="#D7E4F4"/>
  <circle cx="22" cy="325" r="4" fill="#2F7DD1"/>
  <!-- the count is the list's trigger: number in a hover-less pill, caret beside it -->
  <rect x="32" y="318" width="26" height="14" rx="5" fill="#EAF2FD"/>
  <rect x="38" y="322" width="7" height="6" rx="3" fill="#8FB7E4"/>
  <path d="m50 323 3 3 3-3" stroke="#8FB7E4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="94" y="315" width="150" height="20" rx="10" fill="#EAF2FD" stroke="#D7E4F4" stroke-width="1.5"/>
  <circle cx="106" cy="325" r="3.6" fill="#2F7DD1"/>
  <rect x="116" y="321" width="82" height="7" rx="3.5" fill="#8FB7E4"/>
  <rect x="204" y="322" width="26" height="6" rx="3" fill="#C3D6EC"/>

  <rect x="254" y="315" width="140" height="20" rx="10" fill="#FFFFFF" stroke="#D7E4F4" stroke-width="1.5"/>
  <circle cx="266" cy="325" r="3.6" fill="#F0B429"/>
  <rect x="276" y="321" width="72" height="7" rx="3.5" fill="#B9D3F2"/>
  <rect x="354" y="322" width="26" height="6" rx="3" fill="#E6EFFA"/>

  <rect x="404" y="315" width="128" height="20" rx="10" fill="#FFFFFF" stroke="#D7E4F4" stroke-width="1.5"/>
  <circle cx="416" cy="325" r="3.6" fill="#2F7DD1"/>
  <rect x="426" y="321" width="62" height="7" rx="3.5" fill="#B9D3F2"/>
  <rect x="494" y="322" width="26" height="6" rx="3" fill="#E6EFFA"/>

  <!-- close the live bar -->
  <path d="m608 320 8 8m0-8-8 8" stroke="#C3D6EC" stroke-width="2" stroke-linecap="round"/>
</svg>
