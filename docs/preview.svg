<svg width="640" height="300" viewBox="0 0 640 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The recent sessions sheet floats over the sidebar list with subagent and range switches, and one main session folds three subagent sessions under it">
  <!-- sidebar column -->
  <rect x="28" y="22" width="212" height="256" rx="16" fill="#F7FAFE" stroke="#D7E4F4" stroke-width="2"/>
  <rect x="48" y="42" width="120" height="10" rx="5" fill="#DCE8F6"/>
  <rect x="48" y="62" width="164" height="12" rx="6" fill="#E6EFFA"/>
  <rect x="48" y="82" width="140" height="12" rx="6" fill="#E6EFFA"/>

  <!-- the sheet: as wide as the column, floating over its list -->
  <rect x="28" y="98" width="212" height="180" rx="14" fill="#FFFFFF" stroke="#2F7DD1" stroke-width="2"/>
  <rect x="48" y="114" width="86" height="11" rx="5.5" fill="#B9D3F2"/>
  <rect x="152" y="114" width="44" height="11" rx="5.5" fill="#DCE8F6"/>
  <circle cx="216" cy="119" r="5" fill="#DCE8F6"/>

  <!-- switch one: subagents, three segments, the first selected -->
  <rect x="44" y="134" width="180" height="22" rx="8" fill="#EAF1FA"/>
  <rect x="46" y="136" width="58" height="18" rx="6" fill="#2F7DD1"/>
  <rect x="112" y="141" width="40" height="8" rx="4" fill="#C3D6EC"/>
  <rect x="158" y="141" width="40" height="8" rx="4" fill="#C3D6EC"/>

  <!-- switch two: range, four segments -->
  <rect x="44" y="162" width="180" height="22" rx="8" fill="#EAF1FA"/>
  <rect x="46" y="164" width="42" height="18" rx="6" fill="#2F7DD1"/>
  <rect x="92" y="169" width="30" height="8" rx="4" fill="#C3D6EC"/>
  <rect x="126" y="169" width="30" height="8" rx="4" fill="#C3D6EC"/>
  <rect x="160" y="169" width="34" height="8" rx="4" fill="#C3D6EC"/>

  <!-- folded main session: chevron, running dot, title, meta, subagent count -->
  <rect x="42" y="192" width="184" height="34" rx="9" fill="#EAF2FD"/>
  <path d="M54 205l4 4 4-4" stroke="#2F7DD1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="76" cy="205" r="3.5" fill="#2F7DD1"/>
  <rect x="88" y="196" width="86" height="9" rx="4.5" fill="#8FB7E4"/>
  <rect x="88" y="210" width="56" height="6" rx="3" fill="#C3D6EC"/>
  <rect x="182" y="199" width="34" height="13" rx="6.5" fill="#CFE1F6"/>

  <!-- two indented subagent rows -->
  <rect x="60" y="230" width="162" height="22" rx="8" fill="#F3F8FE"/>
  <circle cx="76" cy="241" r="3" fill="#2F7DD1"/>
  <rect x="86" y="237" width="78" height="8" rx="4" fill="#B9D3F2"/>
  <rect x="172" y="238" width="34" height="6" rx="3" fill="#DCE8F6"/>

  <rect x="64" y="256" width="154" height="20" rx="8" fill="#F8FBFE"/>
  <circle cx="80" cy="266" r="3" fill="#DCE8F6"/>
  <rect x="90" y="262" width="62" height="8" rx="4" fill="#D3E3F5"/>
  <rect x="164" y="263" width="30" height="6" rx="3" fill="#E6EFFA"/>

  <!-- close-up: the same parent row, larger -->
  <rect x="336" y="62" width="272" height="46" rx="12" fill="#EAF2FD" stroke="#2F7DD1" stroke-width="2"/>
  <path d="M358 80l5 5 5-5" stroke="#2F7DD1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="386" cy="85" r="5" fill="#2F7DD1"/>
  <rect x="404" y="70" width="112" height="12" rx="6" fill="#8FB7E4"/>
  <rect x="404" y="88" width="74" height="8" rx="4" fill="#C3D6EC"/>
  <rect x="546" y="74" width="44" height="20" rx="10" fill="#CFE1F6"/>

  <rect x="360" y="120" width="240" height="32" rx="10" fill="#F3F8FE"/>
  <circle cx="380" cy="136" r="4" fill="#2F7DD1"/>
  <rect x="394" y="130" width="104" height="10" rx="5" fill="#B9D3F2"/>
  <rect x="394" y="143" width="66" height="7" rx="3.5" fill="#DCE8F6"/>

  <rect x="368" y="160" width="232" height="32" rx="10" fill="#F8FBFE"/>
  <circle cx="388" cy="176" r="4" fill="#DCE8F6"/>
  <rect x="402" y="170" width="88" height="10" rx="5" fill="#D3E3F5"/>
  <rect x="402" y="183" width="52" height="7" rx="3.5" fill="#E6EFFA"/>

  <rect x="376" y="200" width="224" height="30" rx="10" fill="#FBFDFF"/>
  <circle cx="396" cy="215" r="4" fill="#F0B429"/>
  <rect x="410" y="209" width="72" height="10" rx="5" fill="#DCE8F6"/>
  <rect x="410" y="222" width="44" height="7" rx="3.5" fill="#EEF3FA"/>

  <!-- the sheet spans the column; a fourth row peeks under it -->
  <rect x="360" y="250" width="248" height="26" rx="10" fill="#FFFFFF" stroke="#CFE1F6" stroke-width="1.5"/>
  <rect x="378" y="259" width="96" height="9" rx="4.5" fill="#DCE8F6"/>
  <rect x="500" y="259" width="56" height="9" rx="4.5" fill="#E6EFFA"/>
</svg>
